<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Firebase Test</h1>
    <div id="output"></div>
    
    <script>
        function output(msg) {
            document.getElementById('output').innerHTML += '<p>' + msg + '</p>';
            console.log(msg);
        }
        
        output('1. Page loaded');
        
        // Test if we can access the internet
        fetch('https://www.google.com/favicon.ico', {mode: 'no-cors'})
            .then(() => output('2. ✅ Internet connection working'))
            .catch(e => output('2. ❌ Internet connection failed: ' + e.message));
        
        // Test Firebase CDN
        output('3. Testing Firebase CDN...');
        
        // Add Firebase scripts dynamically to see if they load
        const script1 = document.createElement('script');
        script1.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
        script1.onload = function() {
            output('4. ✅ Firebase app script loaded');
            
            const script2 = document.createElement('script');
            script2.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js';
            script2.onload = function() {
                output('5. ✅ Firebase firestore script loaded');
                
                // Test Firebase availability
                setTimeout(() => {
                    if (typeof firebase !== 'undefined') {
                        output('6. ✅ Firebase object available');
                        
                        try {
                            const config = {
                                apiKey: "AIzaSyDGcwqNB9njH0ZumQXKJhvFzl-VLY1u6PQ",
                                authDomain: "vw-beetle-tracker.firebaseapp.com",
                                projectId: "vw-beetle-tracker",
                                storageBucket: "vw-beetle-tracker.firebasestorage.app",
                                messagingSenderId: "720165426241",
                                appId: "1:720165426241:web:4a416dd4136c09f17aa2c0",
                                measurementId: "G-Z6LEP6KY00"
                            };
                            
                            firebase.initializeApp(config);
                            output('7. ✅ Firebase initialized successfully');
                            
                            const db = firebase.firestore();
                            output('8. ✅ Firestore instance created');
                            
                            // Quick test
                            db.collection('debug-test').doc('test').set({
                                timestamp: new Date().toISOString(),
                                test: 'debug-success'
                            }).then(() => {
                                output('9. ✅ Firebase write test SUCCESSFUL - Your Firebase is working!');
                            }).catch(error => {
                                output('9. ❌ Firebase write test failed: ' + error.message);
                            });
                            
                        } catch (error) {
                            output('7. ❌ Firebase initialization failed: ' + error.message);
                        }
                    } else {
                        output('6. ❌ Firebase object not available');
                    }
                }, 1000);
            };
            script2.onerror = function() {
                output('5. ❌ Firebase firestore script failed to load');
            };
            document.head.appendChild(script2);
        };
        script1.onerror = function() {
            output('4. ❌ Firebase app script failed to load');
        };
        document.head.appendChild(script1);
        
        // Error handler
        window.onerror = function(msg, url, line) {
            output('ERROR: ' + msg + ' at ' + url + ':' + line);
        };
    </script>
</body>
</html>
